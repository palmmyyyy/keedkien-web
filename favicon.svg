<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- 1. Vibrant Indigo -> Royal Blue -> Sky Cyan Background -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5" />
      <stop offset="50%" stop-color="#2563EB" />
      <stop offset="100%" stop-color="#06B6D4" />
    </linearGradient>

    <!-- Luminous Top-Left Sky Glow -->
    <radialGradient id="topGlow" cx="20%" cy="16%" r="65%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.42" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0" />
    </radialGradient>

    <!-- Pearl White Sculpted Fountain Nib -->
    <linearGradient id="nibGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#E0F2FE" />
    </linearGradient>

    <!-- Golden Ink Heart Core -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FEF08A" />
      <stop offset="35%" stop-color="#FDE047" />
      <stop offset="100%" stop-color="#F59E0B" />
    </linearGradient>

    <!-- Soft Deep Drop Shadow for Central Nib -->
    <filter id="nibShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F172A" flood-opacity="0.36" />
    </filter>
  </defs>

  <!-- 1. Squircle Canvas Background -->
  <rect width="512" height="512" rx="115" fill="url(#bgGrad)" />
  <rect width="512" height="512" rx="115" fill="url(#topGlow)" />
  <rect x="3" y="3" width="506" height="506" rx="112" fill="none" stroke="#FFFFFF" stroke-opacity="0.22" stroke-width="4" />

  <!-- 2. Iconic Central Fountain Nib & Golden Ink Heart (C4) -->
  <g filter="url(#nibShadow)" transform="translate(256, 256) rotate(35)">
    <path d="M 0 -176 L 114 16 L 68 152 C 62 164, -62 164, -68 152 L -114 16 Z" fill="url(#nibGrad)" />
    <line x1="0" y1="-176" x2="0" y2="-28" stroke="#2563EB" stroke-width="15" stroke-linecap="round" />
    <path d="M 0 -46 C 32 -4, 44 22, 44 46 C 44 72, 24 92, 0 92 C -24 92, -44 72, -44 46 C -44 22, -32 -4, 0 -46 Z" fill="#2563EB" />
    <path d="M 0 -14 C 18 12, 24 28, 24 44 C 24 58, 14 68, 0 68 C -14 68, -24 58, -24 44 C -24 28, -18 12, 0 -14 Z" fill="url(#goldGrad)" />
  </g>
</svg>
